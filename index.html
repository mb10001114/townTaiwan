<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>制鄉鎮等級・台灣</title>
<meta property="og:title" content="制鄉鎮等級台灣版" />
<meta property="og:description" content="點縣市放大，一格一格把 368 個鄉鎮市區點亮" />
<meta property="og:image" content="https://i.meee.com.tw/EwiR6Qa.png" />

<style>
:root{
  --sea:#B4DEF7; --sea-deep:#94CCF0; --ink:#1E2B57; --ink-soft:#4A5A8F;
  --paper:#FFFFFF; --cream:#FFFDF6;
  --lv0:#FFFFFF; --lv1:#63C0F0; --lv2:#4BDBA0; --lv3:#FFD24C; --lv4:#FF9A4D; --lv5:#FF6B6B;
  --gold:#FFD24C;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--sea);
  font-family:"Noto Sans TC","PingFang TC","微軟正黑體","Microsoft JhengHei",system-ui,sans-serif;
  color:var(--ink); overflow:hidden;
}
button{font-family:inherit;color:var(--ink);cursor:pointer}

/* ---------- map ---------- */
#stage{position:fixed;inset:0}
#map{width:100%;height:100%;display:block;touch-action:manipulation}
#map text{font-weight:900;fill:var(--ink);stroke:#fff;stroke-width:3.5;paint-order:stroke;
  vector-effect:non-scaling-stroke;pointer-events:none;user-select:none;text-anchor:middle;dominant-baseline:central}
#countyLabels text{font-size:var(--fsC,17px);letter-spacing:.06em}
#townLabels text{font-size:var(--fsT,12px)}
.town{fill:var(--lv0);stroke:var(--ink-soft);stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke;
  transition:fill .18s ease}
.outline{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;
  vector-effect:non-scaling-stroke;pointer-events:none}
.hit{fill:transparent;cursor:pointer}
.shadowShape{fill:#2C3C74;stroke:#2C3C74;stroke-width:5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.county{transition:transform .16s cubic-bezier(.34,1.56,.64,1),opacity .25s ease;transform-box:fill-box}
.county g{transform-box:fill-box}
@media (hover:hover){ .county.tappable:hover{transform:translateY(-4px)} }
.county.dim{opacity:.32}
.zoomed .county:not(.dim) .town{stroke-width:1.7}
.town.picked{stroke:var(--ink);stroke-width:3.4}
.pop{animation:pop .32s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
.zoomed .town{cursor:pointer}

/* ---------- chrome ---------- */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:0 5px 0 var(--ink)}
.btn{background:var(--paper);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);
  font-weight:900;font-size:14px;padding:8px 12px;line-height:1;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.mini{padding:7px 9px;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.btn.gold{background:var(--gold)}

#hud{position:fixed;left:14px;top:14px;z-index:20;padding:12px 14px;width:232px}
#hud h1{margin:0 0 2px;font-size:17px;font-weight:900;letter-spacing:.02em}
#hud .sub{font-size:11px;color:var(--ink-soft);font-weight:700;margin-bottom:9px}
.meter{height:14px;border:3px solid var(--ink);border-radius:99px;background:#EDF4FF;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lv1),var(--lv2) 45%,var(--lv3) 72%,var(--lv5));
  transition:width .5s cubic-bezier(.22,1,.36,1)}
.figs{display:flex;align-items:flex-end;gap:14px;margin-top:9px}
.fig{display:flex;align-items:baseline;gap:4px}
.fig b{font-size:19px;font-weight:900;line-height:1}
.fig i{font-style:normal;font-size:11px;font-weight:800;color:var(--ink-soft)}
.fig.big b{font-size:42px;line-height:.85;letter-spacing:-.02em}
.fig.big i{font-size:13px;font-weight:900;color:var(--ink)}
.figs em{margin-left:auto;font-style:normal;font-size:13px;font-weight:900;color:var(--ink-soft)}
#nameBtn{background:#FFF3CE;border:2px solid var(--ink);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:900;line-height:1.1}
#hud .sub{display:flex;align-items:center;gap:7px;flex-wrap:wrap}

#tools{position:fixed;right:14px;top:14px;z-index:20;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:46vw}

#panel{position:fixed;right:14px;top:64px;bottom:14px;width:264px;z-index:19;display:flex;flex-direction:column;overflow:hidden}
#panelHead{padding:11px 13px;border-bottom:3px solid var(--ink);display:flex;align-items:center;gap:8px;flex:0 0 auto}
#panelHead b{font-size:15px;font-weight:900}
#panelHead .cnt{margin-left:auto;font-size:12px;font-weight:900;color:var(--ink-soft)}
#panelBody{overflow:auto;padding:8px;flex:1 1 auto;overscroll-behavior:contain}
.crow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:11px;cursor:pointer;border:2px solid transparent}
.crow:hover{background:#F1F7FF}
.crow.done{background:#FFF7DC}
.crow b{font-size:13px;font-weight:900;width:40px;flex:0 0 auto}
.crow .bar{flex:1;height:9px;border-radius:99px;background:#E7EFFA;overflow:hidden}
.crow .bar i{display:block;height:100%;background:var(--ink-soft);transition:width .35s ease}
.crow .n{font-size:11px;font-weight:900;color:var(--ink-soft);width:42px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2.5px solid var(--ink);border-radius:10px;background:var(--lv0);padding:5px 7px;font-size:12px;font-weight:900;
  cursor:pointer;box-shadow:0 2px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip.on{outline:2px dashed var(--ink);outline-offset:2px}

/* ---------- level sheet ---------- */
#sheet{position:fixed;left:50%;bottom:16px;transform:translate(-50%,140%);z-index:30;width:min(520px,calc(100vw - 28px));
  padding:12px;transition:transform .32s cubic-bezier(.22,1,.36,1)}
#sheet.open{transform:translate(-50%,0)}
#sheetTop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#sheetTop b{font-size:17px;font-weight:900}
#sheetTop small{font-size:12px;font-weight:700;color:var(--ink-soft)}
#sheetTop .x{margin-left:auto}
#lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{display:flex;align-items:center;gap:7px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);
  padding:8px;font-weight:900;font-size:13px;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-align:left}
.lv:active{transform:translateY(3px);box-shadow:none}
.lv .dot{width:17px;height:17px;border:2.5px solid var(--ink);border-radius:6px;flex:0 0 auto}
.lv small{display:block;font-size:10px;font-weight:700;color:var(--ink-soft);margin-top:2px}
.lv.on{background:var(--gold)}
#nav{display:flex;gap:8px;margin-top:10px}
#nav .btn{flex:1}

#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);z-index:40;padding:9px 15px;font-weight:900;font-size:14px;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
#toast.show{transform:translate(-50%,0)}

#legend{position:fixed;left:14px;bottom:14px;z-index:18;padding:9px 11px;display:flex;gap:9px;flex-wrap:wrap;max-width:min(420px,60vw)}
#legend div{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:900}
#legend i{width:13px;height:13px;border:2.5px solid var(--ink);border-radius:5px}

#back{position:fixed;left:50%;top:14px;transform:translate(-50%,-120%);z-index:21;transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
#back.show{transform:translate(-50%,0)}

#panel.closed{display:none}

/* ---------- name dialog ---------- */
#mask{position:fixed;inset:0;z-index:60;background:rgba(30,43,87,.45);display:none;align-items:center;justify-content:center;padding:18px}
#mask.open{display:flex}
#nameBox{width:min(360px,100%);padding:18px;max-height:90vh;overflow:auto}
#nameBox b{display:block;font-size:18px;font-weight:900;margin-bottom:6px}
#nameBox p{margin:0 0 12px;font-size:12.5px;font-weight:700;color:var(--ink-soft);line-height:1.6}
#nameInput{display:block;width:100%;border:3px solid var(--ink);border-radius:12px;padding:12px;font-size:16px;font-weight:900;
  font-family:inherit;color:var(--ink);background:var(--cream);outline:none;-webkit-appearance:none;appearance:none}
#nameInput:focus{background:#fff;box-shadow:0 0 0 3px #FFE9A3}
#nameRow{display:flex;gap:8px;margin-top:13px}
#nameRow .btn{flex:1;padding:12px}

/* ---------- touch ---------- */
@media (hover:none){
  .btn{padding:11px 13px;font-size:14.5px}
  .btn.mini{padding:10px 12px;font-size:13.5px}
  .chip{padding:9px 11px;font-size:13.5px}
  .lv{padding:11px 10px;font-size:14px}
  .lv .dot{width:19px;height:19px}
  .crow{padding:11px 9px}
  .crow b{font-size:14px;width:44px}
}

@media (max-width:900px){
  #hud{width:calc(100vw - 24px);left:12px;top:12px;padding:10px 12px}
  #hud h1{font-size:16px}
  .fig.big b{font-size:38px}
  #legend{display:none}
  #tools{left:0;right:0;bottom:0;top:auto;max-width:none;z-index:23;gap:6px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:rgba(180,222,247,.94);border-top:3px solid var(--ink);justify-content:space-between}
  #tools .btn{flex:1;padding:11px 2px;font-size:13px;box-shadow:0 3px 0 var(--ink)}
  #back{left:12px;top:calc(var(--hudH,132px) + 22px);transform:translate(0,-480%)}
  #back.show{transform:translate(0,0)}
  #panel{left:0;right:0;bottom:0;top:auto;width:100%;height:62vh;z-index:25;
    border-radius:var(--r) var(--r) 0 0;border-bottom:0;display:flex;
    padding-bottom:env(safe-area-inset-bottom);
    transform:translateY(102%);transition:transform .3s cubic-bezier(.22,1,.36,1)}
  #panel.closed{display:flex;transform:translateY(102%)}
  #panel:not(.closed){transform:translateY(0)}
  #panelClose{display:inline-block!important}
  #sheet{bottom:calc(76px + env(safe-area-inset-bottom));width:calc(100vw - 24px)}
  #lvls{grid-template-columns:repeat(2,1fr)}
  #toast{font-size:13.5px;padding:8px 13px}
}
@media (max-width:900px) and (orientation:landscape){
  #hud{width:300px}
  #panel{height:80vh}
  #lvls{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage"><svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg></div>

<div id="hud" class="card">
  <h1>制鄉鎮等級・台灣</h1>
  <div class="sub"><span>點縣市放大，再一格一格填</span><button id="nameBtn">取名字</button></div>
  <div class="meter"><i id="meterBar"></i></div>
  <div class="figs">
    <div class="fig big"><b id="figScore">0</b><i>總分</i></div>
    <div class="fig"><b id="figDone">0</b><i>/ 368 已填</i></div>
    <em id="figPct">0%</em>
  </div>
</div>

<div id="tools">
  <button class="btn mini" id="btnList">縣市清單</button>
  <button class="btn mini" id="btnPng">存成圖片</button>
  <button class="btn mini" id="btnSave">匯出紀錄</button>
  <button class="btn mini" id="btnLoad">匯入紀錄</button>
  <button class="btn mini" id="btnReset">清空</button>
</div>

<button class="btn gold" id="back">← 回全台灣</button>

<div id="panel" class="card">
  <div id="panelHead"><b id="panelTitle">全台縣市</b><span class="cnt" id="panelCount"></span>
    <button class="btn mini" id="panelClose" style="display:none">關閉</button></div>
  <div id="panelBody"></div>
</div>

<div id="sheet" class="card">
  <div id="sheetTop"><b id="sheetName">—</b><small id="sheetCounty"></small>
    <button class="btn mini x" id="sheetClose">關閉</button></div>
  <div id="lvls"></div>
  <div id="nav"><button class="btn mini" id="prevTown">← 上一個</button><button class="btn mini" id="nextTown">下一個未填 →</button></div>
</div>

<div id="legend" class="card"></div>
<div id="toast" class="card"></div>
<div id="mask"><div id="nameBox" class="card">
  <b id="nameTitle">怎麼稱呼你？</b>
  <p>名字會顯示在地圖上方，存成圖片時也會一起印上去。之後點名字就能改。</p>
  <input id="nameInput" maxlength="12" placeholder="例如：阿明" autocomplete="off">
  <div id="nameRow"><button class="btn" id="nameSkip">先不用</button><button class="btn gold" id="nameOk">就這個</button></div>
</div></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">

<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('geo').textContent);
const SVGNS = 'http://www.w3.org/2000/svg';
const LEVELS = [
  {v:0, name:'以上皆非', desc:'還沒去過',      c:'#FFFFFF'},
  {v:1, name:'通過',     desc:'路過',          c:'#63C0F0'},
  {v:2, name:'接地',     desc:'休息、換車等',  c:'#4BDBA0'},
  {v:3, name:'訪問',     desc:'遊玩過',        c:'#FFD24C'},
  {v:4, name:'宿泊',     desc:'住宿過',        c:'#FF9A4D'},
  {v:5, name:'住宿',     desc:'居住過',        c:'#FF6B6B'}
];
const KEY = 'townTaiwan.levels.v1';

/* ---------- GA4 ---------- */
function track(name, params){
  try{ if(typeof window.gtag==='function') window.gtag('event', name, params||{}); }catch(e){}
}
const TOTAL = DATA.counties.reduce((s,c)=>s+c.towns.length,0);

/* ---------- state ---------- */
let lv = {};
try{ const raw = localStorage.getItem(KEY); if(raw) lv = JSON.parse(raw)||{}; }catch(e){ lv={}; }
const kOf = (c,t)=> c+'|'+t;
const getLv = (c,t)=> lv[kOf(c,t)]|0;
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(lv)); }catch(e){ toast('瀏覽器空間不足，紀錄沒存進去'); } },180);
}

/* ---------- svg build ---------- */
const svg = document.getElementById('map');
const OVER = (function(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  DATA.counties.forEach(c=>{ x0=Math.min(x0,c.bbox[0]); y0=Math.min(y0,c.bbox[1]); x1=Math.max(x1,c.bbox[2]); y1=Math.max(y1,c.bbox[3]); });
  return [x0,y0,x1,y1];
})();
function el(n,a){ const e=document.createElementNS(SVGNS,n); if(a) for(const k in a) e.setAttribute(k,a[k]); return e; }

svg.innerHTML =
  '<defs><pattern id="waves" width="56" height="48" patternUnits="userSpaceOnUse">'
+ '<path d="M3 32 q10 -12 20 0" fill="none" stroke="#A3D6F4" stroke-width="3.4" stroke-linecap="round"/>'
+ '<path d="M30 10 q10 -12 20 0" fill="none" stroke="#A3D6F4" stroke-width="3.4" stroke-linecap="round"/>'
+ '</pattern></defs>';
const sea = el('rect',{x:-3000,y:-3000,width:9000,height:9000,fill:'var(--sea)'});
const seaP = el('rect',{x:-3000,y:-3000,width:9000,height:9000,fill:'url(#waves)'});
svg.appendChild(sea); svg.appendChild(seaP);
const gShadow = el('g',{id:'shadow'});
const gLand = el('g',{id:'land'});
const gCountyLabels = el('g',{id:'countyLabels'});
const gTownLabels = el('g',{id:'townLabels'});
svg.appendChild(gShadow); svg.appendChild(gLand); svg.appendChild(gCountyLabels); svg.appendChild(gTownLabels);

const townEls = {};   // key -> <path>
const countyEls = []; // {g, hit, towns:{name:path}}
DATA.counties.forEach((c,ci)=>{
  gShadow.appendChild(el('path',{d:c.d, class:'shadowShape'}));
  const g = el('g',{class:'county tappable'});
  g.dataset.ci = ci;
  const gt = el('g',{});
  c.towns.forEach(t=>{
    const p = el('path',{d:t.d, class:'town'});
    p.dataset.ci = ci; p.dataset.tn = t.n;
    p.style.fill = LEVELS[getLv(c.name,t.n)].c;
    gt.appendChild(p);
    townEls[kOf(c.name,t.n)] = p;
  });
  g.appendChild(gt);
  g.appendChild(el('path',{d:c.d, class:'outline'}));
  const hit = el('path',{d:c.d, class:'hit'});
  hit.dataset.ci = ci;
  g.appendChild(hit);
  gLand.appendChild(g);
  countyEls.push({g, hit, gt});

  const tx = el('text',{x:c.label[0], y:c.label[1]});
  tx.textContent = c.short;
  gCountyLabels.appendChild(tx);
});

/* ---------- viewBox / zoom ---------- */
let vb = {x:0,y:0,w:1,h:1};
const compact = ()=> window.innerWidth<=900;
function measureHud(){
  const hud = document.getElementById('hud');
  if(hud) document.body.style.setProperty('--hudH', hud.offsetHeight+'px');
}
function insets(){
  const pad = 12;
  if(compact()){
    const hud = document.getElementById('hud'), tools = document.getElementById('tools');
    return {l:pad, r:pad, t:(hud?hud.offsetHeight:120)+pad*2, b:(tools?tools.offsetHeight:60)+pad};
  }
  const panel = document.getElementById('panel');
  const pw = (panel && !panel.classList.contains('closed')) ? panel.offsetWidth+20 : pad;
  return {l:pad, r:pw, t:pad, b:pad};
}
function fit(box, pad){
  const r = svg.getBoundingClientRect();
  const W = r.width||1, H = r.height||1;
  const ins = insets();
  const aw = Math.max(60, W-ins.l-ins.r), ah = Math.max(60, H-ins.t-ins.b);
  const ar = aw/ah;
  let w = (box[2]-box[0])*(1+pad), h = (box[3]-box[1])*(1+pad);
  const cx = (box[0]+box[2])/2, cy = (box[1]+box[3])/2;
  if(w/h < ar) w = h*ar; else h = w/ar;
  const sc = aw/w;                                  // px per user unit
  return {x: cx-w/2-ins.l/sc, y: cy-h/2-ins.t/sc, w: W/sc, h: H/sc};
}
function applyVB(v){
  vb = v;
  svg.setAttribute('viewBox', v.x+' '+v.y+' '+v.w+' '+v.h);
  const r = svg.getBoundingClientRect();
  const scale = (r.width||1)/v.w;               // user unit -> px
  const u = px => (px/scale);
  svg.style.setProperty('--fsC', u(zoomed? 13 : 17)+'px');
  svg.style.setProperty('--fsT', u(12)+'px');
  const off = 'translate(0,'+u(7).toFixed(2)+')';
  gShadow.setAttribute('transform', off);
  if(activeShadow) activeShadow.setAttribute('transform', off);
}
let anim=null;
function tweenTo(box, pad){
  const to = fit(box, pad);
  if(anim) cancelAnimationFrame(anim);
  const from = {...vb};
  const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches);
  if(reduce){ applyVB(to); return; }
  const t0 = performance.now(), dur = 620;
  (function step(now){
    const k = Math.min(1,(now-t0)/dur);
    const e = k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
    applyVB({x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e, w:from.w+(to.w-from.w)*e, h:from.h+(to.h-from.h)*e});
    if(k<1) anim = requestAnimationFrame(step);
  })(performance.now());
}

/* ---------- modes ---------- */
let zoomed = false, activeCI = -1, pickedTown = null, activeShadow = null;
const $ = s => document.querySelector(s);

function enterCounty(ci, silent){
  const c = DATA.counties[ci];
  activeCI = ci; zoomed = true;
  svg.classList.add('zoomed');
  countyEls.forEach((o,i)=>{
    o.g.classList.toggle('dim', i!==ci);
    o.g.classList.toggle('tappable', false);
    o.hit.style.pointerEvents = i===ci ? 'none' : 'auto';
  });
  if(activeShadow) activeShadow.remove();
  activeShadow = el('path',{d:c.d, class:'shadowShape'});
  countyEls[ci].g.insertBefore(activeShadow, countyEls[ci].g.firstChild);
  gShadow.style.opacity = .3;
  countyEls[ci].g.classList.remove('pop'); void countyEls[ci].g.offsetWidth; countyEls[ci].g.classList.add('pop');
  gCountyLabels.style.opacity = .25;
  renderTownLabels(ci);
  tweenTo(c.bbox, 0.16);
  $('#back').classList.add('show');
  renderPanel();
  const st = countyStat(c);
  if(!silent) toast(c.name+'　'+st.done+'/'+st.total+' 已填');
  track('county_open', {county:c.name, county_done:st.done, county_total:st.total});
  if(!compact() && $('#panel').classList.contains('closed')) panelOpen(true);
}
function exitCounty(){
  if(activeCI>=0) track('county_close', {county:DATA.counties[activeCI].name});
  zoomed = false; activeCI = -1; pickedTown = null;
  svg.classList.remove('zoomed');
  countyEls.forEach(o=>{ o.g.classList.remove('dim'); o.g.classList.add('tappable'); o.hit.style.pointerEvents='auto'; });
  gCountyLabels.style.opacity = 1;
  if(activeShadow){ activeShadow.remove(); activeShadow = null; }
  gShadow.style.opacity = 1;
  gTownLabels.innerHTML = '';
  closeSheet();
  tweenTo(OVER, 0.04);
  $('#back').classList.remove('show');
  renderPanel();
}
function renderTownLabels(ci){
  const c = DATA.counties[ci];
  gTownLabels.innerHTML='';
  const box = c.bbox, span = Math.max(box[2]-box[0], box[3]-box[1]);
  c.towns.forEach(t=>{
    if(t.l[2] < span*0.018) return;          // too thin to hold a label
    const tx = el('text',{x:t.l[0], y:t.l[1]});
    tx.textContent = t.n.replace(/[鄉鎮市區]$/,'');
    gTownLabels.appendChild(tx);
  });
}

/* ---------- picking ---------- */
svg.addEventListener('click', e=>{
  const t = e.target;
  if(t.classList.contains('hit')){ enterCounty(+t.dataset.ci); return; }
  if(zoomed && t.classList.contains('town') && +t.dataset.ci===activeCI){ pick(activeCI, t.dataset.tn); return; }
  if(t===sea || t===seaP){ if(zoomed) exitCounty(); else closeSheet(); }
});
function pick(ci, tn){
  const c = DATA.counties[ci];
  if(pickedTown) { const p = townEls[pickedTown]; if(p) p.classList.remove('picked'); }
  pickedTown = kOf(c.name, tn);
  const p = townEls[pickedTown];
  p.classList.add('picked');
  p.parentNode.appendChild(p);
  $('#sheetName').textContent = tn;
  $('#sheetCounty').textContent = c.name;
  $('#sheet').classList.add('open');
  paintLevelButtons(getLv(c.name,tn));
  markChip();
  track('town_select', {county:c.name, town:tn, current_level:getLv(c.name,tn)});
}
function closeSheet(){
  $('#sheet').classList.remove('open');
  if(pickedTown){ const p=townEls[pickedTown]; if(p) p.classList.remove('picked'); }
  pickedTown = null; markChip();
}
function setLevel(v){
  if(!pickedTown) return;
  if(v===0) delete lv[pickedTown]; else lv[pickedTown]=v;
  townEls[pickedTown].style.fill = LEVELS[v].c;
  save(); paintLevelButtons(v); renderPanel(true);
  const c = DATA.counties[activeCI], s = countyStat(c);
  const tot = refreshStats();
  track('set_level', {county:c.name, town:pickedTown.split('|')[1], level:v, level_name:LEVELS[v].name,
                      total_done:tot.done, total_score:tot.score});
  if(s.done===s.total){ toast('🎉 '+c.name+' 全部填完了！'); track('county_complete', {county:c.name, county_score:s.score}); }
  if(tot.done===TOTAL) track('map_complete', {total_score:tot.score});
  else if(v && tot.done%25===0) track('progress_milestone', {total_done:tot.done, total_score:tot.score});
}
function stepTown(dir){
  if(activeCI<0) return;
  const c = DATA.counties[activeCI], list = c.towns;
  let i = pickedTown ? list.findIndex(t=>kOf(c.name,t.n)===pickedTown) : -1;
  track(dir>0?'next_town':'prev_town', {county:c.name});
  if(dir>0){
    for(let k=1;k<=list.length;k++){ const j=(i+k+list.length)%list.length; if(!getLv(c.name,list[j].n)){ pick(activeCI, list[j].n); return; } }
    toast(c.name+' 已經填完囉');
  }else{
    const j = (i-1+list.length)%list.length;
    pick(activeCI, list[j].n);
  }
}

/* ---------- stats ---------- */
function countyStat(c){
  let done=0, score=0;
  c.towns.forEach(t=>{ const v=getLv(c.name,t.n); if(v){done++; score+=v;} });
  return {done, total:c.towns.length, score};
}
function refreshStats(){
  let done=0, score=0;
  DATA.counties.forEach(c=>{ const s=countyStat(c); done+=s.done; score+=s.score; });
  $('#meterBar').style.width = (done/TOTAL*100).toFixed(1)+'%';
  $('#figDone').textContent = done;
  $('#figScore').textContent = score;
  $('#figPct').textContent = (done/TOTAL*100).toFixed(1)+'% 完成';
  return {done, score};
}

/* ---------- panel ---------- */
function panelOpen(o){
  $('#panel').classList.toggle('closed', !o);
  if(!compact()) tweenTo(zoomed? DATA.counties[activeCI].bbox : OVER, zoomed?0.16:0.04);
}
function renderPanel(keepScroll){
  const body = $('#panelBody'), top = keepScroll ? body.scrollTop : 0;
  if(zoomed){
    const c = DATA.counties[activeCI], s = countyStat(c);
    $('#panelTitle').textContent = c.name;
    $('#panelCount').textContent = s.done+' / '+s.total;
    const wrap = document.createElement('div');
    wrap.className='chips';
    c.towns.forEach(t=>{
      const b = document.createElement('button');
      b.className='chip'; b.textContent=t.n; b.dataset.tn=t.n;
      b.style.background = LEVELS[getLv(c.name,t.n)].c;
      b.onclick = ()=> pick(activeCI, t.n);
      wrap.appendChild(b);
    });
    body.innerHTML=''; body.appendChild(wrap);
    markChip();
  }else{
    $('#panelTitle').textContent='全台縣市';
    const all = DATA.counties.map(countyStat);
    $('#panelCount').textContent = all.filter(s=>s.done===s.total).length+' 縣市全填';
    body.innerHTML='';
    DATA.counties.forEach((c,i)=>{
      const s = all[i];
      const row = document.createElement('div');
      row.className='crow'+(s.done===s.total?' done':'');
      row.innerHTML = '<b>'+c.short+'</b><span class="bar"><i style="width:'+(s.done/s.total*100)+'%"></i></span>'
                    + '<span class="n">'+s.done+'/'+s.total+'</span>';
      row.onclick = ()=>{ enterCounty(i); if(compact()) panelOpen(false); };
      body.appendChild(row);
    });
  }
  body.scrollTop = top;
}
function markChip(){
  document.querySelectorAll('.chip').forEach(b=>{
    const c = DATA.counties[activeCI];
    b.classList.toggle('on', !!c && pickedTown===kOf(c.name,b.dataset.tn));
  });
  if(zoomed && activeCI>=0){
    const c = DATA.counties[activeCI], s = countyStat(c);
    $('#panelCount').textContent = s.done+' / '+s.total;
  }
}

/* ---------- level buttons / legend ---------- */
const lvBox = $('#lvls');
[5,4,3,2,1,0].forEach(v=>{
  const L = LEVELS[v];
  const b = document.createElement('button');
  b.className='lv'; b.dataset.v=v;
  b.innerHTML = '<span class="dot" style="background:'+L.c+'"></span><span>'+L.name+'<small>'+L.desc+'</small></span>';
  b.onclick = ()=> setLevel(v);
  lvBox.appendChild(b);
});
function paintLevelButtons(v){
  lvBox.querySelectorAll('.lv').forEach(b=> b.classList.toggle('on', +b.dataset.v===v));
}
$('#legend').innerHTML = [5,4,3,2,1].map(v=>'<div><i style="background:'+LEVELS[v].c+'"></i>'+LEVELS[v].name+'</div>').join('');

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 1900);
}


/* ---------- 名字 ---------- */
const NKEY='townTaiwan.name', NASK='townTaiwan.nameAsked';
let userName='';
try{ userName = localStorage.getItem(NKEY) || ''; }catch(e){}
function paintName(){
  const b=$('#nameBtn');
  b.textContent = userName ? '「'+userName+'」的地圖' : '取名字';
  b.style.background = userName ? '#FFE9A3' : '#FFF3CE';
}
let nameThen=null;
function askName(title, then){
  nameThen = then || null;
  $('#nameTitle').textContent = title || '怎麼稱呼你？';
  $('#nameInput').value = userName;
  $('#mask').classList.add('open');
  setTimeout(()=>{ try{ $('#nameInput').focus(); }catch(e){} }, 60);
}
function closeName(save_){
  if(save_){
    userName = $('#nameInput').value.trim().slice(0,12);
    try{ localStorage.setItem(NKEY, userName); }catch(e){}
    paintName();
  }
  try{ localStorage.setItem(NASK,'1'); }catch(e){}
  track(save_ && userName ? 'set_name' : 'skip_name', {name_length:userName.length});
  $('#mask').classList.remove('open');
  const f=nameThen; nameThen=null; if(f) f();
}
$('#nameOk').onclick = ()=> closeName(true);
$('#nameSkip').onclick = ()=> closeName(false);
$('#nameBtn').onclick = ()=> askName(userName ? '改個名字？' : '怎麼稱呼你？');
$('#nameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') closeName(true); });
$('#mask').addEventListener('click', e=>{ if(e.target===$('#mask')) closeName(false); });
paintName();

/* ---------- buttons ---------- */
$('#back').onclick = exitCounty;
$('#sheetClose').onclick = closeSheet;
$('#nextTown').onclick = ()=> stepTown(1);
$('#prevTown').onclick = ()=> stepTown(-1);
$('#btnList').onclick = ()=>{
  const open = $('#panel').classList.contains('closed');
  panelOpen(open); track('toggle_list', {opened:open});
};
$('#panelClose').onclick = ()=> panelOpen(false);
$('#btnReset').onclick = ()=>{
  if(!confirm('清空所有紀錄？這個動作沒辦法復原。')) return;
  lv={}; save();
  Object.values(townEls).forEach(p=> p.style.fill = LEVELS[0].c);
  refreshStats(); renderPanel(); toast('紀錄已清空'); track('reset_all');
};
$('#btnSave').onclick = ()=>{
  const blob = new Blob([JSON.stringify({app:'town-taiwan', version:1, saved:new Date().toISOString(), levels:lv},null,1)],{type:'application/json'});
  download(blob, 'town-taiwan-'+new Date().toISOString().slice(0,10)+'.json');
  toast('已匯出紀錄檔');
  const t = refreshStats(); track('export_json', {total_done:t.done, total_score:t.score});
};
$('#btnLoad').onclick = ()=> $('#fileIn').click();
$('#fileIn').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const j = JSON.parse(r.result);
      const data = j.levels || j;
      if(typeof data!=='object') throw 0;
      lv = {}; Object.keys(data).forEach(k=>{ const v=data[k]|0; if(v>0&&v<=5) lv[k]=v; });
      save();
      DATA.counties.forEach(c=> c.towns.forEach(t=>{ townEls[kOf(c.name,t.n)].style.fill = LEVELS[getLv(c.name,t.n)].c; }));
      const t = refreshStats(); renderPanel(); toast('紀錄已匯入');
      track('import_json', {status:'ok', total_done:t.done, total_score:t.score});
    }catch(err){ toast('這個檔讀不出來，請選匯出的 JSON'); track('import_json', {status:'error'}); }
    e.target.value='';
  };
  r.readAsText(f);
};
function download(blob, name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* ---------- png ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
$('#btnPng').onclick = ()=>{
  track('export_png_click', {has_name:!!userName});
  if(!userName){ askName('圖片上要署名嗎？', exportPng); return; }
  exportPng();
};
function exportPng(){
  toast('正在畫圖…');
  setTimeout(()=>{
    const W = 1400;
    const pad = 0.04;
    const box = OVER, w=(box[2]-box[0])*(1+pad), h=(box[3]-box[1])*(1+pad);
    const cx=(box[0]+box[2])/2, cy=(box[1]+box[3])/2;
    const x=cx-w/2, y=cy-h/2;
    const H = Math.round(W*h/w);
    const k = w/W;                                   // user units per output px
    let s = '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="'+x+' '+y+' '+w+' '+h+'">';
    s += '<defs><pattern id="wv" width="56" height="48" patternUnits="userSpaceOnUse">'
       + '<path d="M3 32 q10 -12 20 0" fill="none" stroke="#A3D6F4" stroke-width="3.4" stroke-linecap="round"/>'
       + '<path d="M30 10 q10 -12 20 0" fill="none" stroke="#A3D6F4" stroke-width="3.4" stroke-linecap="round"/></pattern></defs>';
    s += '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#B4DEF7"/>';
    s += '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="url(#wv)"/>';
    s += '<g transform="translate(0,'+(7*k).toFixed(2)+')">';
    DATA.counties.forEach(c=> s+='<path d="'+c.d+'" fill="#2C3C74" stroke="#2C3C74" stroke-width="'+(5*k).toFixed(2)+'" stroke-linejoin="round"/>');
    s += '</g>';
    DATA.counties.forEach(c=>{
      c.towns.forEach(t=> s+='<path d="'+t.d+'" fill="'+LEVELS[getLv(c.name,t.n)].c+'" stroke="#4A5A8F" stroke-width="'+(1*k).toFixed(2)+'" stroke-linejoin="round"/>');
      s += '<path d="'+c.d+'" fill="none" stroke="#1E2B57" stroke-width="'+(2.6*k).toFixed(2)+'" stroke-linejoin="round" stroke-linecap="round"/>';
    });
    DATA.counties.forEach(c=>{
      s += '<text x="'+c.label[0]+'" y="'+c.label[1]+'" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-weight="900" font-size="'+(17*k).toFixed(2)
        +  '" fill="#1E2B57" stroke="#fff" stroke-width="'+(3.5*k).toFixed(2)+'" paint-order="stroke" text-anchor="middle" dominant-baseline="central">'+c.short+'</text>';
    });
    let done=0, score=0;
    DATA.counties.forEach(c=>{ const st=countyStat(c); done+=st.done; score+=st.score; });
    s += '<text x="'+(x+w*0.5)+'" y="'+(y+h*0.045)+'" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-weight="900" font-size="'+(30*k).toFixed(2)
      +  '" fill="#1E2B57" stroke="#fff" stroke-width="'+(5*k).toFixed(2)+'" paint-order="stroke" text-anchor="middle">'
      +  (userName? esc(userName)+'的' : '')+'制鄉鎮等級　'+done+'/'+TOTAL+'　總分 '+score+'</text>';
    s += '</svg>';
    const img = new Image();
    const url = URL.createObjectURL(new Blob([s],{type:'image/svg+xml;charset=utf-8'}));
    img.onload = ()=>{
      const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
      const ctx = cv.getContext('2d'); ctx.drawImage(img,0,0);
      cv.toBlob(b=>{ download(b, (userName? userName+'-' : '')+'town-taiwan.png'); toast('圖片已下載');
        track('export_png', {status:'ok', total_done:done, total_score:score, has_name:!!userName});
        URL.revokeObjectURL(url); });
    };
    img.onerror = ()=>{ toast('圖片產生失敗'); track('export_png', {status:'error'}); URL.revokeObjectURL(url); };
    img.src = url;
  },60);
}

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if($('#sheet').classList.contains('open')) closeSheet(); else if(zoomed) exitCounty(); }
  if(pickedTown && /^[0-5]$/.test(e.key)) setLevel(+e.key);
  if(zoomed && (e.key==='ArrowRight'||e.key==='n')) stepTown(1);
  if(zoomed && (e.key==='ArrowLeft')) stepTown(-1);
});

/* ---------- go ---------- */
let rz=null;
window.addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>{
  measureHud();
  applyVB(fit(zoomed? DATA.counties[activeCI].bbox : OVER, zoomed?0.16:0.04));
},150); });
if(compact()) panelOpen(false);
measureHud();
applyVB(fit(OVER,0.04));
refreshStats(); renderPanel();
setTimeout(measureHud, 0);
setTimeout(()=>applyVB(fit(OVER,0.04)), 30);
(function(){
  const t = refreshStats();
  track('map_ready', {total_done:t.done, total_score:t.score, has_name:!!userName,
                      returning: t.done>0 ? 'yes' : 'no',
                      layout: compact() ? 'compact' : 'wide'});
})();
let asked=false; try{ asked = !!localStorage.getItem(NASK); }catch(e){}
if(!asked && !userName) setTimeout(()=>askName('怎麼稱呼你？'), 500);
})();
</script>
</body>
</html>
